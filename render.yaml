services:
  - type: web
    name: myt-clone-backend
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm install && pip3 install yt-dlp && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: myt-clone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: myt-clone-db
    databaseName: myt_clone
    user: myt_user
    plan: free
